<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoSUAS Mogi</title>

    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        html,
        body,
        .modal,
        .modal-box {
            font-family: "Poppins", sans-serif;
        }

        .modal :focus {
            outline: none;
        }

        #resultados_servicos {
            scrollbar-width: thin;
        }
    </style>
</head>

<body class="h-screen overflow-hidden">

    <nav class="navbar w-full h-16 min-h-16 bg-base-300">
        <label for="my-drawer-4" aria-label="open sidebar" class="btn btn-square btn-ghost drawer-button lg:hidden">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-linejoin="round" stroke-linecap="round"
                stroke-width="2" fill="none" stroke="currentColor" class="my-1.5 inline-block size-4">
                <path d="M4 4m0 2a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-12a2 2 0 0 1-2-2z"></path>
                <path d="M9 4v16"></path>
                <path d="M14 10l2 2l-2 2"></path>
            </svg>
        </label>

        <a href="index.html" class="px-4 btn hover:bg-gray-500/20">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-linejoin="round" stroke-linecap="round"
                stroke-width="2" fill="none" stroke="currentColor" class="my-1.5 inline-block size-4">
                <path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"></path>
                <path
                    d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z">
                </path>
            </svg>
            GeoSUAS
        </a>
    </nav>

    <div class="drawer lg:drawer-open h-[calc(100vh-4rem)]">
        <input id="my-drawer-4" type="checkbox" class="drawer-toggle">

        <div class="drawer-content flex flex-col min-h-0">
            <div class="flex-1 min-h-0">
                <iframe id="mapa_iframe" src="mapa_cras.html" class="w-full h-full border-0"
                    title="Mapa dos CRAS"></iframe>
            </div>
        </div>

        <div class="drawer-side">
            <label for="my-drawer-4" aria-label="close sidebar" class="drawer-overlay"></label>

            <div class="flex min-h-full flex-col items-start bg-base-200 w-80">

                <ul class="menu w-full">
                    <li class="lg:hidden">
                        <a role="button" href="index.html">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-linejoin="round"
                                stroke-linecap="round" stroke-width="2" fill="none" stroke="currentColor"
                                class="my-1.5 inline-block size-4">
                                <path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"></path>
                                <path
                                    d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z">
                                </path>
                            </svg>
                            GeoSUAS
                        </a>
                        <div class="divider py-0 my-0"></div>
                    </li>
                </ul>

                <div class="mx-3 mt-1 w-[calc(100%-1.5rem)]">
                    <p class="mb-1 text-xs font-semibold uppercase tracking-widest text-success">
                        ▌ Buscar serviço:
                    </p>

                    <div class="relative">
                        <label class="input input-bordered input-sm flex items-center gap-2 w-full">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2" class="size-4 opacity-60">
                                <circle cx="11" cy="11" r="7"></circle>
                                <path d="m20 20-3.5-3.5"></path>
                            </svg>

                            <input id="busca_servico" type="text" class="grow" placeholder="Nome, categoria, etc..."
                                autocomplete="off">
                        </label>

                        <div id="resultados_servicos"
                            class="hidden absolute z-[1000] left-0 right-0 mt-1 max-h-64 overflow-y-auto rounded-box bg-base-100 border border-base-300 shadow-xl">
                        </div>
                    </div>
                </div>

                <div class="divider mx-2 my-2"></div>

                <div class="mx-3 w-[calc(100%-1.5rem)]">
                    <p class="mb-2 text-xs font-semibold uppercase tracking-widest text-success">
                        ▌ Mapa de referência:
                    </p>

                    <div class="space-y-2">
                        <label class="flex items-center gap-3 cursor-pointer">
                            <input type="radio" name="tipo_mapa" value="cras" class="radio radio-primary radio-sm"
                                checked>
                            <span class="text-sm">CRAS</span>
                        </label>

                        <label class="flex items-center gap-3 cursor-pointer">
                            <input type="radio" name="tipo_mapa" value="creas" class="radio radio-primary radio-sm">
                            <span class="text-sm">CREAS</span>
                        </label>

                        <label class="flex items-center gap-3 cursor-pointer">
                            <input type="radio" name="tipo_mapa" value="conselho" class="radio radio-primary radio-sm">
                            <span class="text-sm">Conselho Tutelar</span>
                        </label>
                    </div>
                </div>

                <div class="divider mx-2 my-2"></div>

                <div class="mx-3 w-[calc(100%-1.5rem)]">
                    <p class="mb-2 text-xs font-semibold uppercase tracking-widest text-success">
                        ▌ Serviços da Rede:
                    </p>

                    <label class="flex items-center gap-3 cursor-pointer">
                        <input type="checkbox" id="toggle_equipamentos" class="toggle toggle-primary">
                        <span class="text-sm">Mostrar equipamentos</span>
                    </label>

                    <div class="collapse pt-1">
                        <input type="checkbox">

                        <div class="collapse-title mx-0 px-0 text-xs font-semibold uppercase tracking-widest text-info">
                            ⮟ Categorias
                        </div>

                        <div id="categorias_equipamentos" class="collapse-content text-xs px-0 mx-1"></div>
                    </div>
                </div>

                <div class="divider mx-2 my-1"></div>

                <div class="mx-3 py-1 w-[calc(100%-1.5rem)]">
                    <p id="titulo_legenda" class="mb-2 text-xs font-semibold uppercase tracking-widest text-success">
                        ▌ Legenda:
                    </p>

                    <div id="legenda"></div>
                </div>

            </div>
        </div>
    </div>

    <dialog id="bairro_modal" class="modal">
        <form method="dialog" class="modal-backdrop">
            <button></button>
        </form>

        <div class="modal-box">
            <form method="dialog">
                <button
                    class="btn btn-sm btn-circle btn-ghost bg-gray-500/10 hover:bg-red-500/50 absolute right-2 top-2">✕</button>
            </form>

            <h3 id="modal_bairro" class="text-2xl font-bold">Bairro</h3>

            <div class="pb-2">
                <span class="badge badge-sm badge-soft border border-gray-200/30 mr-1" id="modal_cras"></span>
                <span class="badge badge-sm badge-soft border border-gray-200/30 mr-1" id="modal_creas"></span>
                <span class="badge badge-sm badge-soft border border-gray-200/30" id="modal_conselho"></span>
                <br><br>

                <label class="form-control w-full mt-3">
                    <div class="label py-1">
                        <span class="text-sm font-semibold uppercase tracking-widest text-success">
                            ▌ Mês
                        </span>
                    </div>

                    <select id="modal_mes" class="select select-bordered w-full"></select>
                </label>

                <hr class="my-4 text-gray-500">

                <span class="text-sm font-semibold uppercase tracking-widest text-success">
                    ▌ Dados
                </span>

                <div id="modal_cad" class="my-0 py-0"></div>
            </div>

            <div class="modal-action mt-4">
                <form method="dialog">
                    <button class="btn">Fechar</button>
                </form>
            </div>
        </div>
    </dialog>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const toggleEquipamentos = document.getElementById("toggle_equipamentos");
            const mapaIframe = document.getElementById("mapa_iframe");
            const categoriasContainer = document.getElementById("categorias_equipamentos");
            const tituloLegenda = document.getElementById("titulo_legenda");
            const legenda = document.getElementById("legenda");
            const buscaServico = document.getElementById("busca_servico");
            const resultadosServicos = document.getElementById("resultados_servicos");

            if (!toggleEquipamentos || !mapaIframe || !categoriasContainer ||
                !tituloLegenda || !legenda || !buscaServico || !resultadosServicos) return;

            toggleEquipamentos.checked = false;

            let servicos = [];

            function normalizarTexto(texto) {
                return String(texto || "")
                    .normalize("NFD")
                    .replace(/[\u0300-\u036f]/g, "")
                    .toLowerCase()
                    .trim();
            }

            function mostrarResultadosServicos(resultados) {
                resultadosServicos.innerHTML = "";

                if (!resultados.length) {
                    resultadosServicos.innerHTML = `
                <div class="p-3 text-xs opacity-60">
                    Nenhum serviço encontrado.
                </div>
            `;
                    resultadosServicos.classList.remove("hidden");
                    return;
                }

                resultados.forEach(function (servico) {
                    const item = document.createElement("button");
                    item.type = "button";
                    item.className = "w-full text-left p-3 hover:bg-base-200 border-b border-base-300 last:border-0";

                    item.innerHTML = `
                <div class="font-semibold text-sm">
                    ${servico.nome || "Equipamento"}
                </div>

                <div class="text-xs opacity-60 mt-1">
                    ${servico.categoria || "Sem categoria"}
                    ${servico.bairro ? " • " + servico.bairro : ""}
                </div>

                ${servico.endereco ? `
                    <div class="text-xs opacity-50 mt-1 truncate">
                        ${servico.endereco}
                    </div>
                ` : ""}
            `;

                    item.addEventListener("click", function () {
                        if (mapaIframe.contentWindow) {
                            mapaIframe.contentWindow.postMessage({
                                tipo: "localizar_servico",
                                id: servico.id
                            }, "*");
                        }

                        buscaServico.value = servico.nome || "";
                        resultadosServicos.classList.add("hidden");

                        const drawer = document.getElementById("my-drawer-4");

                        if (drawer && window.innerWidth < 1024) {
                            drawer.checked = false;
                        }
                    });

                    resultadosServicos.appendChild(item);
                });

                resultadosServicos.classList.remove("hidden");
            }

            function buscarServicos() {
                const termo = normalizarTexto(buscaServico.value);

                if (!termo) {
                    resultadosServicos.innerHTML = "";
                    resultadosServicos.classList.add("hidden");
                    return;
                }

                const resultados = servicos
                    .filter(function (servico) {
                        const texto = normalizarTexto([
                            servico.nome,
                            servico.categoria,
                            servico.endereco,
                            servico.bairro
                        ].join(" "));

                        return texto.includes(termo);
                    })
                    .slice(0, 15);

                mostrarResultadosServicos(resultados);
            }

            buscaServico.addEventListener("input", buscarServicos);

            buscaServico.addEventListener("focus", function () {
                if (buscaServico.value.trim()) buscarServicos();
            });

            document.addEventListener("click", function (event) {
                if (!buscaServico.contains(event.target) &&
                    !resultadosServicos.contains(event.target)) {
                    resultadosServicos.classList.add("hidden");
                }
            });

            const legendas = {
                cras: {
                    titulo: "Legenda:",
                    itens: [
                        { nome: "CRAS Centro", cor: "bg-red-500" },
                        { nome: "CRAS César de Souza", cor: "bg-blue-500" },
                        { nome: "CRAS Jardim Layr", cor: "bg-green-500" },
                        { nome: "CRAS Jundiapeba I", cor: "bg-orange-500" },
                        { nome: "CRAS Jundiapeba II", cor: "bg-yellow-500" },
                        { nome: "CRAS Vila Brasileira", cor: "bg-purple-500" },
                        { nome: "CRAS Vila Nova União", cor: "bg-pink-500" }
                    ]
                },

                creas: {
                    titulo: "Legenda:",
                    itens: [
                        { nome: "CREAS Centro", cor: "bg-red-500" },
                        { nome: "CREAS Brás Cubas", cor: "bg-blue-500" },
                        { nome: "CREAS Jundiapeba", cor: "bg-green-500" }
                    ]
                },

                conselho: {
                    titulo: "Legenda:",
                    itens: [
                        { nome: "Conselho Tutelar Centro", cor: "bg-red-500" },
                        { nome: "Conselho Tutelar Brás Cubas", cor: "bg-blue-500" },
                        { nome: "Conselho Tutelar César de Souza", cor: "bg-green-500" },
                        { nome: "Conselho Tutelar Jundiapeba", cor: "bg-orange-500" }
                    ]
                }
            };

            function atualizarLegenda(tipo) {
                const dados = legendas[tipo] || legendas.cras;

                tituloLegenda.textContent = "▌ " + dados.titulo;
                legenda.innerHTML = "";

                dados.itens.forEach(function (item) {
                    const linha = document.createElement("div");
                    linha.className = "flex items-center mb-1 text-sm";

                    const marcador = document.createElement("div");
                    marcador.className = "badge badge-sm rounded-full mr-2 " + item.cor;

                    const texto = document.createElement("span");
                    texto.textContent = item.nome;

                    linha.appendChild(marcador);
                    linha.appendChild(texto);
                    legenda.appendChild(linha);
                });
            }

            function enviarTipoMapa(tipo) {
                if (!mapaIframe.contentWindow) return;

                mapaIframe.contentWindow.postMessage({
                    tipo: "trocar_mapa",
                    mapa: tipo
                }, "*");

                atualizarLegenda(tipo);
            }

            function enviarEstadoEquipamentos() {
                if (!mapaIframe.contentWindow) return;

                mapaIframe.contentWindow.postMessage({
                    tipo: "toggle_equipamentos",
                    mostrar: toggleEquipamentos.checked
                }, "*");
            }

            function enviarFiltroCategorias() {
                if (!mapaIframe.contentWindow) return;

                const categoriasSelecionadas = Array.from(
                    categoriasContainer.querySelectorAll("input[type='checkbox']:checked")
                ).map(function (checkbox) {
                    return checkbox.value;
                });

                mapaIframe.contentWindow.postMessage({
                    tipo: "filtro_equipamentos",
                    categorias: categoriasSelecionadas
                }, "*");
            }

            function criarCategorias(categorias) {
                categoriasContainer.innerHTML = "";

                categorias.forEach(function (categoria) {
                    const label = document.createElement("label");
                    label.className = "label whitespace-normal gap-2 mb-1 w-full";

                    const checkbox = document.createElement("input");
                    checkbox.type = "checkbox";
                    checkbox.className = "checkbox checkbox-xs";
                    checkbox.value = categoria;
                    checkbox.addEventListener("change", enviarFiltroCategorias);

                    label.appendChild(checkbox);
                    label.appendChild(document.createTextNode(categoria));
                    categoriasContainer.appendChild(label);
                });
            }

            document.querySelectorAll("input[name='tipo_mapa']").forEach(function (radio) {
                radio.addEventListener("change", function () {
                    if (this.checked) enviarTipoMapa(this.value);
                });
            });

            mapaIframe.addEventListener("load", function () {
                const radioSelecionado = document.querySelector(
                    "input[name='tipo_mapa']:checked"
                );

                enviarTipoMapa(
                    radioSelecionado ? radioSelecionado.value : "cras"
                );

                enviarEstadoEquipamentos();
            });

            toggleEquipamentos.addEventListener("change", enviarEstadoEquipamentos);

            window.addEventListener("message", function (event) {
                if (!event.data) return;

                if (event.data.tipo === "categorias_equipamentos") {
                    criarCategorias(event.data.categorias || []);
                    return;
                }

                if (event.data.tipo === "servicos_equipamentos") {
                    servicos = event.data.servicos || [];
                    return;
                }

                if (event.data.tipo !== "bairro_clicado") return;

                const bairro = event.data.bairro;
                const cras = event.data.cras;
                const creas = event.data.creas;
                const conselho = event.data.conselho_tutelar;
                const cadGeral = event.data.cad_geral || {};

                document.getElementById("modal_bairro").textContent = bairro;
                document.getElementById("modal_cras").textContent = cras;
                document.getElementById("modal_creas").textContent = creas;
                document.getElementById("modal_conselho").textContent = conselho;

                const seletorMes = document.getElementById("modal_mes");
                seletorMes.innerHTML = "";

                Object.keys(cadGeral).forEach(function (mes) {
                    const option = document.createElement("option");
                    option.value = mes;
                    option.textContent = mes;
                    seletorMes.appendChild(option);
                });

                function criarTabela(titulo, medidas, dados) {
                    let tabela = `
                <h4 class="text-md font-bold mt-1 mb-2">${titulo}</h4>
                <div class="overflow-x-auto">
                    <table class="table table-zebra border-2 border-base-300 rounded-xs mb-5">
                        <tbody>
            `;

                    medidas.forEach(function (medida) {
                        if (dados[medida] !== undefined) {
                            tabela += `
                        <tr>
                            <td>${medida}</td>
                            <td>${dados[medida]}</td>
                        </tr>
                    `;
                        }
                    });

                    return tabela + `
                        </tbody>
                    </table>
                </div>
            `;
                }

                function mostrarCadGeral(mes) {
                    const dados = cadGeral[mes] || {};
                    const container = document.getElementById("modal_cad");

                    let html = "";

                    html += criarTabela(
                        "1. Quantidade de Pessoas e Famílias no Cadastro Único",
                        ["Famílias", "Pessoas"],
                        dados
                    );

                    html += criarTabela(
                        "2. Renda per capita por Domicílio - Sistema CadUnico",
                        [
                            "Renda - Até R$218,00",
                            "Renda - Entre R$ 219,00 e R$ 660,00",
                            "Renda - Entre R$ 661,00 e R$ 1320,00",
                            "Renda - Acima de R$ 1320,00",
                            "Renda - Entre R$ 219,00 e R$ 706,00",
                            "Renda - Entre R$ 707,00 e R$ 1412,00",
                            "Renda - Acima de R$ 1412,00",
                            "Renda - Entre R$ 219,00 e R$ 759,00",
                            "Renda - Entre R$ 760,00 e R$ 1518,00",
                            "Renda - Acima de R$ 1518,00"
                        ],
                        dados
                    );

                    html += criarTabela(
                        "3. Faixa etária - Sistema CadUnico",
                        [
                            "0 a 5 anos",
                            "6 a 9 anos",
                            "10 a 12 anos",
                            "13 a 14 anos",
                            "15 a 17 anos",
                            "18 a 29 anos",
                            "30 a 59 anos",
                            "60 a 69 anos",
                            "70 a 79 anos",
                            "80 a 89 anos",
                            "90 anos ou mais"
                        ],
                        dados
                    );

                    html += criarTabela(
                        "4. Raça ou Cor - Sistema CadUnico",
                        [
                            "Branco",
                            "Preto",
                            "Amarelo",
                            "Pardo",
                            "Indígena",
                            "Não Identificado"
                        ],
                        dados
                    );

                    html += criarTabela(
                        "5. Programas e condições",
                        [
                            "PBF",
                            "Pessoa com Deficiência",
                            "Deficiência Visual",
                            "Deficiência Auditiva",
                            "Deficiência Física",
                            "Deficiência Mental",
                            "Deficiência Síndrome Down",
                            "Deficiência Transtorno Mental"
                        ],
                        dados
                    );

                    container.innerHTML = html;
                }

                const primeiroMes = Object.keys(cadGeral)[0];

                if (primeiroMes) {
                    seletorMes.value = primeiroMes;
                    mostrarCadGeral(primeiroMes);
                }

                seletorMes.onchange = function () {
                    mostrarCadGeral(this.value);
                };

                document.getElementById("bairro_modal").showModal();
            });

            atualizarLegenda("cras");
        });
    </script>

</body>

</html>
